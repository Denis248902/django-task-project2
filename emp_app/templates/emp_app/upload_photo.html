{% extends "base.html" %}

{% block content %}
<h1>Загрузить фото для {{ employee.full_name }}</h1>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Загрузить</button>
</form>

<p><a href="{% url 'employee_detail' pk=employee.pk %}">← Назад к сотруднику</a></p>
{% endblock %}
